name: Validate FangraphSavant
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - name: Confirm Cloudflare site output
        run: test -s dist/index.html && test -s dist/app.js && test -s dist/styles.css
