name: Import FangraphSavant source ZIP
on:
  push:
    branches: [main]
    paths:
      - 'FangraphSavant-github-cloudflare.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack source
        run: |
          test -f FangraphSavant-github-cloudflare.zip
          unzip -o -q FangraphSavant-github-cloudflare.zip -d .
          rm FangraphSavant-github-cloudflare.zip
          test -s index.html
          test -s app.js
          test -s styles.css
          test -s functions/api/mlb/'[[path]].js'
          test -s functions/api/statcast/'[[path]].js'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test and build
        run: |
          npm test
          npm run build
      - name: Commit extracted sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import FangraphSavant website and API Functions"
            git push origin HEAD:main
          fi
