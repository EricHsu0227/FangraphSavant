name: Install FangraphSavant project package
on:
  push:
    branches: [main]
    paths:
      - 'FangraphSavant-github-cloudflare.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract the web app and Cloudflare Functions
        run: |
          unzip -oq FangraphSavant-github-cloudflare.zip -d .
          rm FangraphSavant-github-cloudflare.zip
          rm -f scripts/expand.mjs
          rm -f .github/workflows/expand.yml
      - name: Test and build
        run: |
          npm test
          npm run build
      - name: Commit complete editable source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Add FangraphSavant app with MLB and Statcast Cloudflare Functions"
          git push
