name: Publish FangraphSavant source
on:
  push:
    branches: [main]
    paths:
      - 'source/chunk04.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore editable source files
        run: node scripts/expand.mjs
      - name: Commit complete project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Publish FangraphSavant beta source and Cloudflare Pages Functions"
          git push
